
name: Discord Release Announcements

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave empty for newest release)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Retrieve release information
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            jq -e '.release' "$GITHUB_EVENT_PATH" > release.json
          else
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -e --arg tag "$RELEASE_TAG" '
                  [.[] | select(.draft == false and .published_at != null)]
                  | if $tag != "" then
                      (map(select(.tag_name == $tag)) | first)
                    else
                      (sort_by(.published_at) | last)
                    end
                ' > release.json
          fi

          jq -e '.id and .html_url' release.json > /dev/null

      - name: Send changelog to Discord
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Missing DISCORD_WEBHOOK_URL secret"
            exit 1
          fi

          jq -n --slurpfile release release.json '
            $release[0] as $r |

            (
              if ($r.name // "") == "" then
                $r.tag_name
              else
                $r.name
              end
            ) as $name |

            (
              if ($r.body // "") == "" then
                "No release notes were provided."
              else
                $r.body
              end
            ) as $notes |

            (
              if ($notes | length) > 3500 then
                $notes[:3500] +
                "\n\n... [Read full changelog](" +
                $r.html_url + ")"
              else
                $notes
              end
            ) as $description |

            {
              username: "BJR Motorsport Expansion",
              allowed_mentions: {parse: []},
              embeds: [{
                title: ("🏁 " + $name)[:256],
                url: $r.html_url,
                description: $description,
                color: 16753920,
                fields: [{
                  name: "📦 Download",
                  value: (
                    "[View release and download files](" +
                    $r.html_url + ")"
                  ),
                  inline: false
                }],
                footer: {
                  text: "BJR Motorsport Expansion • Release Notes"
                }
              }]
            }
          ' > payload.json

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            -H "Content-Type: application/json" \
            --data-binary @payload.json \
            "$DISCORD_WEBHOOK_URL"
