name: Standalone generators
on:
  workflow_dispatch:
  push:
    paths: ['tools/**', 'donors/**', 'packaging/**', 'tests/test_distribution*', 'tests/test_release*', 'build_release.py', '.github/workflows/generator.yml']
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number counts commits
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r packaging/requirements.txt
      - run: python -I tools/build_generator.py
      - run: python -X utf8 -I tests/test_distribution.py
      - run: python -X utf8 -I tests/test_distribution_package.py
      - run: python -X utf8 -I tests/test_release_updates.py
      - run: python -I tests/test_distribution_parity.py --executable dist/bjrme-generator/bjrme-generator${{ runner.os == 'Windows' && '.exe' || '' }}
      - run: python -I build_release.py --generator-dir dist/bjrme-generator --edition play --output dist/bjrme-play-${{ runner.os }}-x64.zip
      - run: python -I build_release.py --generator-dir dist/bjrme-generator --edition custom --output dist/bjrme-custom-${{ runner.os }}-x64.zip
      - run: python -X utf8 -I tests/test_release_update_native.py --archive dist/bjrme-play-${{ runner.os }}-x64.zip
      - run: python -X utf8 -I tests/test_release_update_native.py --archive dist/bjrme-custom-${{ runner.os }}-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bjrme-${{ runner.os }}-x64
          path: dist/bjrme-*-x64.zip
